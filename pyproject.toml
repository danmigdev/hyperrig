[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperrig"
version = "0.1.0"
description = "Reproducible UltraRig firmware research and M-VAVE Tank Mini port groundwork"
requires-python = ">=3.12"

[project.optional-dependencies]
midi = ["python-rtmidi>=1.5,<2"]
installer = ["python-rtmidi>=1.5,<2", "pyserial>=3.5,<4"]

[project.scripts]
hyperrig = "hyperrig.__main__:main"

[tool.setuptools]
packages = ["hyperrig", "hyperrig.installer"]

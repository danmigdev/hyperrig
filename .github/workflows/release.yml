name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version (example: 0.1.0-preview.1)'
        required: true
        default: 0.1.0-preview.1
        type: string
      android_version_code:
        description: Android version code (increase for every distributed APK)
        required: true
        default: '10001'
        type: string
      create_draft:
        description: Attach all artifacts to a draft prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  RELEASE_VERSION: ${{ inputs.version }}
  ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub exposes draft build-input assets only to callers with push access.
    # This job downloads and checks inputs; it has no Android signing secrets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate request and source privacy
        run: |
          python - <<'PY'
          import os
          from tools.build_release import version, code
          from tools.audit_source_privacy import scan
          version(os.environ['RELEASE_VERSION'])
          code(os.environ['ANDROID_VERSION_CODE'])
          result = scan()
          assert not result['findings'], result['findings']
          print('Release inputs and source privacy checks passed.')
          PY
      - name: Check packaging boundaries
        run: python -m unittest discover -s tests -p test_release_build.py -v
      - name: Download and verify immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_release.py fetch --output build/inputs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-inputs
          path: build/inputs/*.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-inputs
          path: build/inputs
      - name: Install pinned packaging dependencies
        run: python -m pip install --disable-pip-version-check -r tools/release/requirements-windows.txt
      - name: Build Windows executable and verify sealed package
        run: python tools/build_release.py windows --inputs build/inputs/HyperRig-MINI-v4-inputs-02.zip --output build/windows-output --version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            build/windows-output/*.zip
            build/windows-output/*-provenance.json
          if-no-files-found: error
          retention-days: 30

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-inputs
          path: build/inputs
      - name: Install Android SDK Build Tools
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          sdk = Path(os.environ['ANDROID_HOME'])
          if not (sdk / 'build-tools/36.0.0/lib/apksigner.jar').is_file():
              managers = sorted((sdk / 'cmdline-tools').glob('*/bin/sdkmanager'))
              if not managers:
                  raise RuntimeError('Android SDK command-line tools are missing')
              subprocess.run([str(managers[-1]), 'build-tools;36.0.0'], check=True)
          print('Android SDK Build Tools 36.0.0 available.')
          PY
      - name: Build and verify signed Android APK
        env:
          HYPERRIG_ANDROID_KEYSTORE_BASE64: ${{ secrets.HYPERRIG_ANDROID_KEYSTORE_BASE64 }}
          HYPERRIG_ANDROID_KEY_ALIAS: ${{ secrets.HYPERRIG_ANDROID_KEY_ALIAS }}
          HYPERRIG_ANDROID_STORE_PASSWORD: ${{ secrets.HYPERRIG_ANDROID_STORE_PASSWORD }}
          HYPERRIG_ANDROID_KEY_PASSWORD: ${{ secrets.HYPERRIG_ANDROID_KEY_PASSWORD }}
        run: python tools/build_release.py android --inputs build/inputs/HyperRig-MINI-v4-inputs-02.zip --output build/android-output --version "$RELEASE_VERSION" --android-version-code "$ANDROID_VERSION_CODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            build/android-output/*.apk
            build/android-output/*-provenance.json
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [prepare, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-inputs
          path: build/inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{windows,android}'
          merge-multiple: true
          path: build/release
      - name: Package firmware, web editor, sources and checksums
        run: |
          python tools/build_release.py portable --inputs build/inputs/HyperRig-MINI-v4-inputs-02.zip --output build/release --version "$RELEASE_VERSION"
          python tools/build_release.py finish --output build/release --version "$RELEASE_VERSION"
          cd build/release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HyperRig-MINI-${{ inputs.version }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 30

  draft:
    if: inputs.create_draft
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HyperRig-MINI-${{ inputs.version }}
          path: build/release
      - name: Create draft prerelease with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release_draft.py --artifacts build/release --version "$RELEASE_VERSION"

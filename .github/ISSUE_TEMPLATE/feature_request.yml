name: Feature request
description: Suggest an improvement for HyperRig.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe your use case in English.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain how this should work on the MINI or in the editor.
    validations:
      required: true
